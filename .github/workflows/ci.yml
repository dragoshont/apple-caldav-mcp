name: ci

# Test + lint on every push and PR. On pushes to main and on version tags,
# additionally build and push a container image to GHCR. Per the project's
# image convention, release versions come from git tags (vX.Y.Z) and are
# published as semantic tags (0.1.2, 0.1) — never git-sha-only.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    # Fail the build if a private identity / secret pattern ever lands in this
    # public repo. The same script runs as a local pre-commit guard.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for private identities / secrets
        run: bash scripts/check-pii.sh

  test:
    needs: hygiene
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (with dev deps)
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Test (offline — no network, no Apple call, no secrets)
        run: pytest -q

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # On a version tag vX.Y.Z -> publish 0.1.2 and 0.1 (semantic), plus the
          # raw tag. On main -> latest + sha-<short> (for traceability only; pin
          # deployments to a semantic version from a tag, not to a sha).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64-only on branch pushes (fast); full multi-arch on version tags
          # (arm64 builds under QEMU, slower — reserve it for releases).
          platforms: ${{ startsWith(github.ref, 'refs/tags/') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
